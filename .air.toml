root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/omega ./cmd/omega"
  entrypoint = "./tmp/omega"
  args_bin = ["serve"]
  delay = 300
  include_ext = ["go", "yaml", "yml", "env"]
  exclude_dir = ["tmp", "bin", "web", "node_modules", ".git"]
  exclude_regex = ["_test\\.go$"]
  stop_on_error = true
  send_interrupt = true
  kill_delay = 500

[log]
  time = false

[misc]
  clean_on_exit = true
