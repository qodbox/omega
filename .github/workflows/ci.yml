name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTH_SECRET: an-integration-secret-long-enough-to-sign

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^web/' || true)
          if [ -n "$unformatted" ]; then
            echo "these files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Tests
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic -coverpkg=./...

      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out

  vulnerabilities:
    name: Avis de securite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # govulncheck ne signale que ce que le code appelle reellement, donc il ne
      # bruite pas sur une dependance vulnerable mais inutilisee. Zero au moment
      # de ce commit : l'etape bloque la fusion plutot que de constater apres coup.
      - name: Dependances et bibliotheque standard
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  postgres:
    name: Go on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: omega
          POSTGRES_USER: omega
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omega"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_CONNECTION: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: omega
      DB_USERNAME: omega
      DB_PASSWORD: secret
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Migrate
        run: go run ./cmd/omega migrate

      - name: Migrations roll back
        run: |
          go run ./cmd/omega migrate:reset
          go run ./cmd/omega migrate

      # Row locks, SKIP LOCKED, advisory locks and transactional DDL only exist
      # on the real engine: these tests skip without the DSN.
      - name: Queue, scheduler and migrations on PostgreSQL
        env:
          OMEGA_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=omega password=secret dbname=omega sslmode=disable
        run: go test -race -count=1 ./internal/queue/... ./internal/scheduler/... ./internal/database/...

  web:
    name: Interface (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [nuxt, react, next]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Nuxt 4.6 and react-router 8.5 need Node 22.22 or later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Scaffold the frontend
        run: go run ./cmd/omega web:${{ matrix.stack }}

      - name: Install
        working-directory: web
        run: bun install

      - name: Lint
        working-directory: web
        run: bun run lint

      - name: Typecheck
        working-directory: web
        run: if grep -q '"typecheck"' package.json; then bun run typecheck; fi

      - name: Build
        working-directory: web
        run: bun run build

  docker:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: omega:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image boots and answers
        run: |
          docker run -d --name omega \
            -p 3000:3000 \
            -e AUTH_SECRET="$AUTH_SECRET" \
            omega:ci serve
          for attempt in $(seq 1 20); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then
              echo "the API answered after $attempt attempt(s)"
              docker rm -f omega
              exit 0
            fi
            sleep 1
          done
          docker logs omega
          exit 1

      - name: Image size
        run: docker images omega:ci --format '{{.Size}}'
